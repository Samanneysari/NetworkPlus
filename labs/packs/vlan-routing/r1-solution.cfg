hostname R1
interface GigabitEthernet0/0
 no shutdown
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group USER_TO_SERVER in
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
interface GigabitEthernet0/0.999
 encapsulation dot1Q 999 native
 no ip address
ip access-list extended USER_TO_SERVER
 permit tcp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 443
 permit udp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 53
 permit tcp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 53
 deny ip 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 log
 permit ip 10.10.10.0 0.0.0.255 any
end
